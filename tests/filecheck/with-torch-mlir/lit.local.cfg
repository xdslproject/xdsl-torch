import shlex
from importlib.resources import files

torch_mlir_opt = files("torch_mlir") / "_mlir_libs" / "torch-mlir-opt"

config.substitutions.append(('TORCH_MLIR_ROUNDTRIP', "xdsl-torch-opt %s | torch-mlir-opt --allow-unregistered-dialect | xdsl-torch-opt | filecheck %s"))
config.substitutions.append(('TORCH_MLIR_GENERIC_ROUNDTRIP', "xdsl-torch-opt %s --print-op-generic | torch-mlir-opt --mlir-print-op-generic --allow-unregistered-dialect --mlir-print-local-scope | xdsl-torch-opt | filecheck %s"))
config.substitutions.append(('torch-mlir-opt', shlex.quote(str(torch_mlir_opt))))
